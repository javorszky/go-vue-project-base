name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-lint:
    name: Go — lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

  go-test:
    name: Go — test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/...

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
          fail_ci_if_error: false

  go-version-sync:
    name: Go — go.mod / Dockerfile pin sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # The go directive is the enforced minimum Go version; the builder image runs
      # GOTOOLCHAIN=local, so it cannot compensate for a directive it does not satisfy.
      # Renovate groups both bumps into one PR ("golang"), but the two sources publish
      # at different times — this check keeps a half-applied group PR from automerging.
      - name: go directive matches builder image tag
        run: |
          go_ver=$(grep -m1 '^go ' go.mod | awk '{print $2}')
          img_ver=$(grep -m1 '^FROM golang:' build/Dockerfile | sed -E 's/^FROM golang:([0-9.]+)-alpine.*/\1/')
          if [ -z "$go_ver" ] || [ -z "$img_ver" ]; then
            printf 'Could not parse versions — go.mod=%s Dockerfile=%s\n' "${go_ver:-<none>}" "${img_ver:-<none>}"
            exit 1
          fi
          if [ "$go_ver" != "$img_ver" ]; then
            printf 'Go version mismatch:\n  go.mod go directive:        %s\n  build/Dockerfile golang tag: %s\nBoth must move together — see the "golang" group in renovate.json.\n' "$go_ver" "$img_ver"
            exit 1
          fi
          printf 'Go versions in sync: %s\n' "$go_ver"

  frontend-lint:
    name: Frontend — lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Prettier — format check
        run: npm run format:check
        working-directory: frontend

      - name: TypeScript — type check
        run: npm run typecheck
        working-directory: frontend

  shell-lint:
    name: Shell — shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck scripts/*.sh

  frontend-test:
    name: Frontend — test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Test
        run: npm run test:coverage
        working-directory: frontend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
