name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC — catch newly disclosed CVEs

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy — vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          # Report all severities to code scanning for visibility; the
          # blocking decision is made by the gate step below.
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          # Fail the job only on actionable findings: critical/high with a
          # fix available. Unfixed CVEs stay visible in code scanning above
          # without blocking every merge.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  govulncheck:
    name: govulncheck — reachable Go CVEs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        # Pinned so CI runs are reproducible; Renovate keeps this current.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  # No image-scanning job yet: nothing in CI builds or publishes a container
  # image. When a release workflow lands, add a trivy image scan against the
  # pushed tag there.
  dependency-review:
    name: Dependency review — PR diff CVEs & licences
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  zizmor:
    name: Zizmor — workflow security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # lets zizmor resolve action metadata for richer analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
